[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netforge-mcp"
version = "0.1.0"
description = "Open-source AI-native MCP platform for designing, configuring, validating, and automating Cisco Packet Tracer networks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "NetForge Contributors" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "cisco",
    "packet-tracer",
    "networking",
    "automation",
    "ipam",
    "ios",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]
gui = [
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "psutil>=5.9.0",
    "pywin32>=306; sys_platform == 'win32'",
]
http = [
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
]

[project.urls]
Homepage = "https://github.com/gg1i/netforge-mcp"
Documentation = "https://github.com/gg1i/netforge-mcp/tree/main/docs"
Repository = "https://github.com/gg1i/netforge-mcp"
Issues = "https://github.com/gg1i/netforge-mcp/issues"

[project.scripts]
netforge-mcp = "netforge.cli:main"
netforge = "netforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["netforge*"]

[tool.setuptools.package-data]
"netforge.adapters.assets" = ["*.js", "*.html", "*.pts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "unit: fast offline unit tests requiring no Packet Tracer installation",
    "integration: integration tests against local protocols or services",
    "packet_tracer: tests requiring a live local Cisco Packet Tracer GUI instance",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>NetForge Bridge</title></head>
<body>
<pre id="status">idle</pre>
<script>
(function () {
    var cfg = { session_id: "", url: "", token: "" };
    var polling = false;
    var generation = 0;
    var consecutiveFailures = 0;
    var reportedSuccess = false;
    var MAX_FAILED_POLLS = 3;

    function setStatus(msg) {
        try {
            var el = document.getElementById("status");
            if (el) { el.textContent = msg; }
        } catch (e) {}
    }

    function recordFailure(gen, reason) {
        try {
            if (gen !== generation || !polling) { return; }
            consecutiveFailures += 1;
            setStatus("err:" + consecutiveFailures + ":" + String(reason || ""));
            if (typeof window.$se === "function") {
                try {
                    window.$se(
                        "netforgeOnPollFailure",
                        String(cfg.session_id || ""),
                        String(consecutiveFailures),
                        String(reason || "")
                    );
                } catch (eSe) {}
            }
            if (consecutiveFailures >= MAX_FAILED_POLLS) {
                polling = false;
                setStatus("blacklisted:" + String(cfg.session_id || ""));
                return;
            }
            setTimeout(function () { pollOnce(gen); }, 800);
        } catch (e) {}
    }

    function recordSuccess() {
        try {
            if (consecutiveFailures > 0 || !reportedSuccess) {
                consecutiveFailures = 0;
                reportedSuccess = true;
                if (typeof window.$se === "function") {
                    try {
                        window.$se("netforgeOnPollSuccess", String(cfg.session_id || ""));
                    } catch (eSe) {}
                }
            }
        } catch (e) {}
    }

    function pollOnce(gen) {
        try {
            if (!polling || gen !== generation || !cfg.url || !cfg.token) {
                return;
            }
            fetch(cfg.url + "/v1/commands/next?wait_ms=1500", {
                method: "GET",
                headers: { "X-NetForge-Token": cfg.token }
            })
            .then(function (resp) {
                if (gen !== generation || !polling) { return; }
                if (resp.status === 204) {
                    recordSuccess();
                    setTimeout(function () { pollOnce(gen); }, 10);
                    return;
                }
                if (!resp.ok) {
                    recordFailure(gen, "http_" + resp.status);
                    return;
                }
                recordSuccess();
                return resp.json().then(function (payload) {
                    if (gen !== generation || !polling) { return; }
                    if (payload && payload.command && typeof window.$se === "function") {
                        var c = payload.command;
                        setStatus("exec:" + c.opcode);
                        window.$se("netforgeOnCommand", c.request_id, c.opcode, JSON.stringify(c.params || {}));
                    }
                    setTimeout(function () { pollOnce(gen); }, 5);
                });
            })
            .catch(function (err) {
                recordFailure(gen, err);
            });
        } catch (e) {
            recordFailure(gen, e);
        }
    }

    window.netforgeStart = function (nextCfg) {
        try {
            var incoming = nextCfg || { session_id: "", url: "", token: "" };
            var nextSid = String(incoming.session_id || "");
            var nextUrl = String(incoming.url || "");
            var nextToken = String(incoming.token || "");
            if (polling && cfg.session_id === nextSid && cfg.url === nextUrl && cfg.token === nextToken) {
                return;
            }
            cfg = { session_id: nextSid, url: nextUrl, token: nextToken };
            generation += 1;
            consecutiveFailures = 0;
            reportedSuccess = false;
            polling = Boolean(cfg.url && cfg.token);
            setStatus(polling ? "polling:" + cfg.url : "stopped");
            if (polling) {
                pollOnce(generation);
            }
        } catch (e) {}
    };

    window.netforgePostResult = function (resultObj) {
        if (!cfg.url || !cfg.token) { return; }
        fetch(cfg.url + "/v1/commands/result", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-NetForge-Token": cfg.token
            },
            body: JSON.stringify(resultObj)
        }).catch(function () {});
    };

    window.netforgePingReady = function () {
        if (typeof window.$se === "function") {
            window.$se("netforgeOnWebViewReady");
        }
    };

    var iv = setInterval(function () {
        if (typeof window.$se === "function") {
            clearInterval(iv);
            window.netforgePingReady();
        }
    }, 100);
})();
</script>
</body>
</html>

name: AgenticNet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install AgenticNet with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff
        run: ruff check agenticnet netforge tests scripts

      - name: Run offline unit & MCP protocol tests
        run: pytest -m "not packet_tracer"

      - name: Verify CLI manifest generation & legacy CLI alias
        run: |
          agenticnet version
          agenticnet manifest --output agenticnet-manifest.json
          netforge version
